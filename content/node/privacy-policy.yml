  field_description:
    -
      value: 'This privacy policy describes how and why we might access, collect, store, use, and/or share your personal information when you use our services, including when you visit our website at or any website of ours that links to this Privacy Notice, or engage with us in other related ways, including any sales, marketing, or events.'
  field_content:
    -
      value: '<p>This Privacy Policy for Curtis Tinkers ("<strong>we</strong>," "<strong>us</strong>," or "<strong>our</strong>"), describes how and why we might access, collect, store, use, and/or share ("<strong>process</strong>") your personal information when you use our services ("<strong>Services</strong>"), including when you:</p><ul><li data-list-item-id="ed0554f586159303a1fb194c31ca65461">Visit our website at curtistinkers.com, or any website of ours that links to this Privacy Policy</li><li data-list-item-id="ef4ca74debd78302b581a06e8cb3441b3">Engage with us in other related ways, including any sales, marketing, or events</li></ul><p><strong>Questions or concerns?</strong> Reading this Privacy Policy will help you understand your privacy rights and choices. We are responsible for making decisions about how your personal information is processed. If you do not agree with our policies and practices, please do not use our Services. If you still have any questions or concerns, please contact us at privacy@curtistinkers.com.</p><h2><strong>SUMMARY OF KEY POINTS</strong></h2><p><em><strong>This summary provides key points from our Privacy Policy, but you can find out more details about any of these topics by clicking the link following each key point or by using our</strong></em> <a href="#jump-toc"><em><strong>table of contents</strong></em></a> <em><strong>below to find the section you are looking for.</strong></em></p><p><strong>What personal information do we process?</strong> When you visit, use, or navigate our Services, we may process personal information depending on how you interact with us and the Services, the choices you make, and the products and features you use. Learn more about <a href="#jump-personalinfo">personal information you disclose to us</a>.</p><p><strong>Do we process any sensitive personal information?</strong> Some of the information may be considered "special" or "sensitive" in certain jurisdictions, for example your racial or ethnic origins, sexual orientation, and religious beliefs. We do not process sensitive personal information.</p><p><strong>Do we collect any information from third parties?</strong> We do not collect any information from third parties.</p><p><strong>How do we process your information?</strong> We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent. We process your information only when we have a valid legal reason to do so. Learn more about <a href="#jump-infouse">how we process your information</a>.</p><p><strong>In what situations and with which types of parties do we share personal information?</strong> We may share information in specific situations and with specific categories of third parties. Learn more about <a href="#jump-whoshare">when and with whom we share your personal information</a>.</p><p><strong>How do we keep your information safe?</strong> We have adequate organizational and technical processes and procedures in place to protect your personal information. However, no electronic transmission over the internet or information storage technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers, cybercriminals, or other unauthorized third parties will not be able to defeat our security and improperly collect, access, steal, or modify your information. Learn more about <a href="#jump-infosafe">how we keep your information safe</a>.</p><p><strong>What are your rights?</strong> Depending on where you are located geographically, the applicable privacy law may mean you have certain rights regarding your personal information. Learn more about <a href="#jump-privacyrights">your privacy rights</a>.</p><p><strong>How do you exercise your rights?</strong> The easiest way to exercise your rights is by visiting curtistinkers.com/contact, or by contacting us. We will consider and act upon any request in accordance with applicable data protection laws.</p><p>Want to learn more about what we do with any information we collect? <a href="#jump-toc">Review the Privacy Policy in full</a>.</p><h2>TABLE OF CONTENTS</h2><ol><li data-list-item-id="ea2762ef138913896409065a4ab294e7d"><a href="#jump-infocollect">WHAT INFORMATION DO WE COLLECT?</a></li><li data-list-item-id="e6893b9775032ae375ebf0d260f255e29"><a href="#jump-infouse">HOW DO WE PROCESS YOUR INFORMATION?</a></li><li data-list-item-id="e55fa6035ab042407b88a31ab06c4c1bb"><a href="#jump-legalbases">WHAT LEGAL BASES DO WE RELY ON TO PROCESS YOUR PERSONAL INFORMATION?</a></li><li data-list-item-id="ec21ed9ed25993bbb374696e67ca973b7"><a href="#jump-whoshare">WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?</a></li><li data-list-item-id="ebe44424917970ea8de00f882fbed2fb7"><a href="#jump-3pwebsites">WHAT IS OUR STANCE ON THIRD-PARTY WEBSITES?</a></li><li data-list-item-id="e6ed5d296899c6235afe0255fbfea3074"><a href="#jump-cookies">DO WE USE COOKIES AND OTHER TRACKING TECHNOLOGIES?</a></li><li data-list-item-id="e0976cd7e49833eef06d97cc0e648bda4"><a href="#jump-ai">DO WE OFFER ARTIFICIAL INTELLIGENCE-BASED PRODUCTS?</a></li><li data-list-item-id="eb4fe45888d8f275666911ba712190f10"><a href="#jump-sociallogins">HOW DO WE HANDLE YOUR SOCIAL LOGINS?</a></li><li data-list-item-id="ea5fe83fceaeb756227fe37ac4a06426e"><a href="#jump-intltransfers">IS YOUR INFORMATION TRANSFERRED INTERNATIONALLY?</a></li><li data-list-item-id="ee588c4e67ffb04cda6c1b6901ec88f29"><a href="#jump-inforetain">HOW LONG DO WE KEEP YOUR INFORMATION?</a></li><li data-list-item-id="ec217777826779de25426587e8cb1b40f"><a href="#jump-infosafe">HOW DO WE KEEP YOUR INFORMATION SAFE?</a></li><li data-list-item-id="edec225b9b7ba16779cbe3d21a42583b2"><a href="#jump-privacyrights">WHAT ARE YOUR PRIVACY RIGHTS?</a></li><li data-list-item-id="e0576939e9d81cd15184e89765620d52b"><a href="#jump-DNT">CONTROLS FOR DO-NOT-TRACK FEATURES</a></li><li data-list-item-id="e44962b5bdbe9ee856f1d22db19c5e668"><a href="#jump-uslaws">DO UNITED STATES RESIDENTS HAVE SPECIFIC PRIVACY RIGHTS?</a></li><li data-list-item-id="e0f7739e6e4e06a19c35e97ffd5f5f46f"><a href="#jump-otherlaws">DO OTHER REGIONS HAVE SPECIFIC PRIVACY RIGHTS?</a></li><li data-list-item-id="e63848b445808505529fde26ab0f0d728"><a href="#jump-policyupdates">DO WE MAKE UPDATES TO THIS NOTICE?</a></li><li data-list-item-id="e0d1d1675eb8271ac159ebcf8a9b4100a"><a href="#jump-contact">HOW CAN YOU CONTACT US ABOUT THIS NOTICE?</a></li><li data-list-item-id="e26d8294892214bedfb5b4c3ec831e062"><a href="#jump-request">HOW CAN YOU REVIEW, UPDATE, OR DELETE THE DATA WE COLLECT FROM YOU?</a></li></ol><h2><strong>1. WHAT INFORMATION DO WE COLLECT?</strong></h2><h3><strong>Personal information you disclose to us</strong></h3><p><em><strong>In Short:</strong> We collect personal information that you provide to us.</em></p><p>We collect personal information that you voluntarily provide to us when you register on the Services,&nbsp;express an interest in obtaining information about us or our products and Services, when you participate in activities on the Services, or otherwise when you contact us.</p><p><strong>Personal Information Provided by You.</strong> The personal information that we collect depends on the context of your interactions with us and the Services, the choices you make, and the products and features you use. The personal information we collect may include the following:</p><ul><li data-list-item-id="e751e2333cb0cba1d6b4b53e921c1cfa8">names</li><li data-list-item-id="e36768bf2a73e710788cf42463536b3ff">email addresses</li><li data-list-item-id="e64603987e4a2c390d3968bc9ec8ff4a2">usernames</li><li data-list-item-id="e7cf53312b4f3ecb2c7f72473d3b27efa">passwords</li><li data-list-item-id="eba11ce5721977763b918596666b89c50">contact preferences</li></ul><p><strong>Sensitive Information.</strong> We do not process sensitive information.</p><p><strong>Social Media Login Data.</strong> We may provide you with the option to register with us using your existing social media account details, like your Facebook, X, or other social media account. If you choose to register in this way, we will collect certain profile information about you from the social media provider, as described in the section called "<a href="#jump-sociallogins">HOW DO WE HANDLE YOUR SOCIAL LOGINS?</a>" below.</p><p>All personal information that you provide to us must be true, complete, and accurate, and you must notify us of any changes to such personal information.</p><h3><strong>Information automatically collected</strong></h3><p><em><strong>In Short:</strong> Some information — such as your Internet Protocol (IP) address and/or browser and device characteristics — is collected automatically when you visit our Services.</em></p><p>We automatically collect certain information when you visit, use, or navigate the Services. This information does not reveal your specific identity (like your name or contact information) but may include device and usage information, such as your IP address, browser and device characteristics, operating system, language preferences, referring URLs, device name, country, location, information about how and when you use our Services, and other technical information. This information is primarily needed to maintain the security and operation of our Services, and for our internal analytics and reporting purposes.</p><p>Like many businesses, we also collect information through cookies and similar technologies.</p><p>The information we collect includes:</p><ul><li data-list-item-id="efe036d3f1287b3bdfb0c9f8e97d0afb4"><em>Log and Usage Data.</em> Log and usage data is service-related, diagnostic, usage, and performance information our servers automatically collect when you access or use our Services and which we record in log files. Depending on how you interact with us, this log data may include your IP address, device information, browser type, and settings and information about your activity in the Services&nbsp;(such as the date/time stamps associated with your usage, pages and files viewed, searches, and other actions you take such as which features you use), device event information (such as system activity, error reports (sometimes called "crash dumps"), and hardware settings).</li><li data-list-item-id="e3c21f34edcab4e8a1928417b3211877c"><em>Device Data.</em> We collect device data such as information about your computer, phone, tablet, or other device you use to access the Services. Depending on the device used, this device data may include information such as your IP address (or proxy server), device and application identification numbers, location, browser type, hardware model, Internet service provider and/or mobile carrier, operating system, and system configuration information.</li><li data-list-item-id="e8b88fdb6c7a46f34112234b4bfd66a54"><em>Location Data.</em> We collect location data such as information about your device''s location, which can be either precise or imprecise. How much information we collect depends on the type and settings of the device you use to access the Services. For example, we may use GPS and other technologies to collect geolocation data that tells us your current location (based on your IP address). You can opt out of allowing us to collect this information either by refusing access to the information or by disabling your Location setting on your device. However, if you choose to opt out, you may not be able to use certain aspects of the Services.</li></ul><h3><strong>Google API</strong></h3><p>Our use of information received from Google APIs will adhere to <a href="https://developers.google.com/terms/api-services-user-data-policy">Google API Services User Data Policy</a>, including the <a href="https://developers.google.com/terms/api-services-user-data-policy#limited-use">Limited Use requirements</a>.<br>&nbsp;</p><h2><strong>2. HOW DO WE PROCESS YOUR INFORMATION?</strong></h2><p><em><strong>In Short:</strong> We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent.</em></p><p><strong>We process your personal information for a variety of reasons, depending on how you interact with our Services, including:</strong></p><ul><li data-list-item-id="e2d2345258697c0d83df50844e59d289a"><strong>To facilitate account creation and authentication and otherwise manage user accounts.</strong> We may process your information so you can create and log in to your account, as well as keep your account in working order.</li><li data-list-item-id="ea52b85427805705a31bc35efa85494a4"><strong>To send you marketing and promotional communications.</strong> We may process the personal information you send to us for our marketing purposes, if this is in accordance with your marketing preferences. You can opt out of our marketing emails at any time. For more information, see "<a href="#jump-privacyrights">WHAT ARE YOUR PRIVACY RIGHTS?</a>" below.</li><li data-list-item-id="eee7f59c7c21a8c01d62da6d12eafa2a6"><strong>To deliver targeted advertising to you.</strong> We may process your information to develop and display personalized content and advertising tailored to your interests, location, and more.</li><li data-list-item-id="e3c3916069b1597cdff3f93bfb7765b8e"><strong>To identify usage trends.</strong> We may process information about how you use our Services to better understand how they are being used so we can improve them.</li><li data-list-item-id="e459e76becae9ac055571939051a30df0"><strong>To determine the effectiveness of our marketing and promotional campaigns.</strong> We may process your information to better understand how to provide marketing and promotional campaigns that are most relevant to you.</li><li data-list-item-id="ed7b4b2d512eb549d0da20b039cb64bfc"><strong>To save or protect an individual''s vital interest.</strong> We may process your information when necessary to save or protect an individual’s vital interest, such as to prevent harm.</li></ul><h2><strong>3. WHAT LEGAL BASES DO WE RELY ON TO PROCESS YOUR INFORMATION?</strong></h2><p><em><strong>In Short:</strong> We only process your personal information when we believe it is necessary and we have a valid legal reason (i.e., legal basis) to do so under applicable law, like with your consent, to comply with laws, to provide you with services to enter into or fulfill our contractual obligations, to protect your rights, or to fulfill our legitimate business interests.</em></p><p><em><strong>If you are located in the EU or UK, this section applies to you.</strong></em></p><p>The General Data Protection Regulation (GDPR) and UK GDPR require us to explain the valid legal bases we rely on in order to process your personal information. As such, we may rely on the following legal bases to process your personal information:</p><ul><li data-list-item-id="e5909a359f53e9bec30cf145f6cd912d3"><strong>Consent.</strong> We may process your information if you have given us permission (i.e., consent) to use your personal information for a specific purpose. You can withdraw your consent at any time. Learn more about <a href="#jump-withdrawconsent">withdrawing your consent</a>.</li><li data-list-item-id="e7088f2e95a611754094d2bbdb84f21f3"><strong>Legitimate Interests.</strong> We may process your information when we believe it is reasonably necessary to achieve our legitimate business interests and those interests do not outweigh your interests and fundamental rights and freedoms. For example, we may process your personal information for some of the purposes described in order to:</li><li data-list-item-id="e12f0227f3f0f7976df4770e86cea597e">Send users information about special offers and discounts on our products and services</li><li data-list-item-id="edc63b4725b7b5a170c763f58b3edae42">Develop and display personalized and relevant advertising content for our users</li><li data-list-item-id="e14268b0efc59d2f8e7ef786472facf51">Analyze how our Services are used so we can improve them to engage and retain users</li><li data-list-item-id="ee411dea68878ff06ca44f335b1767e77">Support our marketing activities</li><li data-list-item-id="ef4d6743e8f6853ace0f9c69d49d57485"><strong>Legal Obligations.</strong> We may process your information where we believe it is necessary for compliance with our legal obligations, such as to cooperate with a law enforcement body or regulatory agency, exercise or defend our legal rights, or disclose your information as evidence in litigation in which we are involved.<br>&nbsp;</li><li data-list-item-id="ea590533565f6280cb97f52f31cecae43"><strong>Vital Interests.</strong> We may process your information where we believe it is necessary to protect your vital interests or the vital interests of a third party, such as situations involving potential threats to the safety of any person.</li></ul><p><em><strong>If you are located in Canada, this section applies to you.</strong></em></p><p>We may process your information if you have given us specific permission (i.e., express consent) to use your personal information for a specific purpose, or in situations where your permission can be inferred (i.e., implied consent). You can <a href="#jump-withdrawconsent">withdraw your consent</a>&nbsp;at any time.</p><p>In some exceptional cases, we may be legally permitted under applicable law to process your information without your consent, including, for example:</p><ul><li data-list-item-id="e01a5be6a373a042eda4e943a2027ea31">If collection is clearly in the interests of an individual and consent cannot be obtained in a timely way</li><li data-list-item-id="eb1e873e2471134eb932c4928f971db81">For investigations and fraud detection and prevention</li><li data-list-item-id="ee46b0f7a59b194fd6e61dcc7075b0ee8">For business transactions provided certain conditions are met</li><li data-list-item-id="e4c32eb180bd78d8d65b12cba66db7871">If it is contained in a witness statement and the collection is necessary to assess, process, or settle an insurance claim</li><li data-list-item-id="e52d9e47616c92ff3efe2b3d216e5dc2d">For identifying injured, ill, or deceased persons and communicating with next of kin</li><li data-list-item-id="efaf21e77821843cd4338d9e50bde0793">If we have reasonable grounds to believe an individual has been, is, or may be victim of financial abuse</li><li data-list-item-id="eadd9c1ed26a40d5911af881287a77dda">If it is reasonable to expect collection and use with consent would compromise the availability or the accuracy of the information and the collection is reasonable for purposes related to investigating a breach of an agreement or a contravention of the laws of Canada or a province</li><li data-list-item-id="ebc9a8a68421c45a0225d12ffecf30904">If disclosure is required to comply with a subpoena, warrant, court order, or rules of the court relating to the production of records</li><li data-list-item-id="e1ba39cb0aff6e706f6d1e3bed0cd5f19">If it was produced by an individual in the course of their employment, business, or profession and the collection is consistent with the purposes for which the information was produced</li><li data-list-item-id="ed4f1a447e3a55f49b3f380fce9c17117">If the collection is solely for journalistic, artistic, or literary purposes</li><li data-list-item-id="ee1d591ff3ed6b7c14b9f7cd7c6a11a87">If the information is publicly available and is specified by the regulations</li></ul><h2><strong>4. WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?</strong></h2><p><em><strong>In Short:</strong> We may share information in specific situations described in this section and/or with the following categories of third parties.</em></p><p><strong>Vendors, Consultants, and Other Third-Party Service Providers.</strong> We may share your data with third-party vendors, service providers, contractors, or agents ("<strong>third parties</strong>") who perform services for us or on our behalf and require access to such information to do that work. We have contracts in place with our third parties, which are designed to help safeguard your personal information. This means that they cannot do anything with your personal information unless we have instructed them to do it. They will also not share your personal information with any organization apart from us. They also commit to protect the data they hold on our behalf and to retain it for the period we instruct.</p><p>The categories of third parties we may share personal information with are as follows:</p><ul><li data-list-item-id="e89ac14a1a0861b6e21c59f8fdea068a3">Affiliate Marketing Programs</li><li data-list-item-id="eec90831b377e33b692010c4a472ef33c">AI Platforms</li><li data-list-item-id="e6dd4455b7937f930aa8b0b88229c7266">Communication &amp; Collaboration Tools</li><li data-list-item-id="ed25c06eccf4a9f5fb40fa3b696fd201a">Data Analytics Services</li><li data-list-item-id="e6896252a4518f66124ee8c8089f8966a">Payment Processors</li><li data-list-item-id="e09a381a511692fef2af0fd95375043b4">Sales &amp; Marketing Tools</li><li data-list-item-id="e1cd250718e49797141514ef5ece1447d">Social Networks</li><li data-list-item-id="e232e5ddf0ee521aea487a373ac6ce9dd">User Account Registration &amp; Authentication Services</li></ul><p>We also may need to share your personal information in the following situations:</p><ul><li data-list-item-id="e159f28ccb954f573ea1eccfdaae0b6a2"><strong>Business Transfers.</strong> We may share or transfer your information in connection with, or during negotiations of, any merger, sale of company assets, financing, or acquisition of all or a portion of our business to another company.</li><li data-list-item-id="e271740b373db1abf797a92dd4edb195a"><strong>Affiliates.</strong> We may share your information with our affiliates, in which case we will require those affiliates to honor this Privacy Policy. Affiliates include our parent company and any subsidiaries, joint venture partners, or other companies that we control or that are under common control with us.</li><li data-list-item-id="eff0ff587b095f18ff92e3563a59d0ca8"><strong>Business Partners.</strong> We may share your information with our business partners to offer you certain products, services, or promotions.</li></ul><h2><strong>5. WHAT IS OUR STANCE ON THIRD-PARTY WEBSITES?</strong></h2><p><em><strong>In Short:</strong> We are not responsible for the safety of any information that you share with third parties that we may link to or who advertise on our Services, but are not affiliated with, our Services.</em></p><p>The Services may link to third-party websites, online services, or mobile applications and/or contain advertisements from third parties that are not affiliated with us and which may link to other websites, services, or applications. Accordingly, we do not make any guarantee regarding any such third parties, and we will not be liable for any loss or damage caused by the use of such third-party websites, services, or applications. The inclusion of a link towards a third-party website, service, or application does not imply an endorsement by us. We cannot guarantee the safety and privacy of data you provide to any third-party websites. Any data collected by third parties is not covered by this Privacy Policy. We are not responsible for the content or privacy and security practices and policies of any third parties, including other websites, services, or applications that may be linked to or from the Services. You should review the policies of such third parties and contact them directly to respond to your questions.</p><h2><strong>6. DO WE USE COOKIES AND OTHER TRACKING TECHNOLOGIES?</strong></h2><p><em><strong>In Short:</strong> We may use cookies and other tracking technologies to collect and store your information.</em></p><p>We may use cookies and similar tracking technologies (like web beacons and pixels) to gather information when you interact with our Services. Some online tracking technologies help us maintain the security of our Services and your account, prevent crashes, fix bugs, save your preferences, and assist with basic site functions.</p><p>We also permit third parties and service providers to use online tracking technologies on our Services for analytics and advertising, including to help manage and display advertisements, to tailor advertisements to your interests, or to send abandoned shopping cart reminders (depending on your communication preferences). The third parties and service providers use their technology to provide advertising about products and services tailored to your interests which may appear either on our Services or on other websites.</p><p>To the extent these online tracking technologies are deemed to be a "sale"/"sharing" (which includes targeted advertising, as defined under the applicable laws) under applicable US state laws, you can opt out of these online tracking technologies by submitting a request as described below under section "<a href="#jump-uslaws">DO UNITED STATES RESIDENTS HAVE SPECIFIC PRIVACY RIGHTS?</a>"</p><p>Specific information about how we use such technologies and how you can refuse certain cookies is set out in our Cookie Notice.</p><h3><strong>Google Analytics</strong></h3><p>We may share your information with Google Analytics to track and analyze the use of the Services. The Google Analytics Advertising Features that we may use include: Google Analytics Demographics and Interests Reporting. To opt out of being tracked by Google Analytics across the Services, visit <a href="https://tools.google.com/dlpage/gaoptout">https://tools.google.com/dlpage/gaoptout</a>. You can opt out of Google Analytics Advertising Features through <a href="https://adssettings.google.com/">Ads Settings</a> and Ad Settings for mobile apps. Other opt out means include <a href="http://optout.networkadvertising.org/">http://optout.networkadvertising.org/</a> and <a href="http://www.networkadvertising.org/mobile-choice">http://www.networkadvertising.org/mobile-choice</a>. For more information on the privacy practices of Google, please visit the <a href="https://policies.google.com/privacy">Google Privacy &amp; Terms page</a>.</p><h2><strong>7. DO WE OFFER ARTIFICIAL INTELLIGENCE-BASED PRODUCTS?</strong></h2><p><em><strong>In Short:</strong> We offer products, features, or tools powered by artificial intelligence, machine learning, or similar technologies.</em></p><p>As part of our Services, we offer products, features, or tools powered by artificial intelligence, machine learning, or similar technologies (collectively, "AI Products"). These tools are designed to enhance your experience and provide you with innovative solutions. The terms in this Privacy Policy govern your use of the AI Products within our Services.</p><p><strong>Use of AI Technologies</strong></p><p>We provide the AI Products through third-party service providers ("AI Service Providers"), including Anthropic and OpenAI. As outlined in this Privacy Policy, your input, output, and personal information will be shared with and processed by these AI Service Providers to enable your use of our AI Products for purposes outlined in "<a href="#jump-legalbases">WHAT LEGAL BASES DO WE RELY ON TO PROCESS YOUR PERSONAL INFORMATION?</a>" You must not use the AI Products in any way that violates the terms or policies of any AI Service Provider.</p><p><strong>Our AI Products</strong></p><p>Our AI Products are designed for the following functions:</p><ul><li data-list-item-id="e6343cc25d8d63a526b8a65fc14eba9f3">AI bots</li><li data-list-item-id="e8988707b88e1a2a788f67c56a2a43464">AI search</li><li data-list-item-id="e76412c8844bb4962a487c6f38951fb12">Blockchain</li></ul><p><strong>How We Process Your Data Using AI</strong></p><p>All personal information processed using our AI Products is handled in line with our Privacy Policy and our agreement with third parties. This ensures high security and safeguards your personal information throughout the process, giving you peace of mind about your data''s safety.</p><h2><strong>8. HOW DO WE HANDLE YOUR SOCIAL LOGINS?</strong></h2><p><em><strong>In Short:</strong> If you choose to register or log in to our Services using a social media account, we may have access to certain information about you.</em></p><p>Our Services offer you the ability to register and log in using your third-party social media account details (like your Facebook or X logins). Where you choose to do this, we will receive certain profile information about you from your social media provider. The profile information we receive may vary depending on the social media provider concerned, but will often include your name, email address, friends list, and profile picture, as well as other information you choose to make public on such a social media platform.</p><p>We will use the information we receive only for the purposes that are described in this Privacy Policy or that are otherwise made clear to you on the relevant Services. Please note that we do not control, and are not responsible for, other uses of your personal information by your third-party social media provider. We recommend that you review their Privacy Policy to understand how they collect, use, and share your personal information, and how you can set your privacy preferences on their sites and apps.</p><h2><strong>9. IS YOUR INFORMATION TRANSFERRED INTERNATIONALLY?</strong></h2><p><em><strong>In Short:</strong> We may transfer, store, and process your information in countries other than your own.</em></p><p>Our servers are located in the United States. If you are accessing our Services from outside the United States, please be aware that your information may be transferred to, stored by, and processed by us in our facilities and in the facilities of the third parties with whom we may share your personal information (see "<a href="#jump-whoshare">WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?</a>" above), in the United States,&nbsp;and other countries.</p><p>If you are a resident in the European Economic Area (EEA), United Kingdom (UK), or Switzerland, then these countries may not necessarily have data protection laws or other similar laws as comprehensive as those in your country. However, we will take all necessary measures to protect your personal information in accordance with this Privacy Notice and applicable law.</p><p>European Commission''s Standard Contractual Clauses:</p><p>We have implemented measures to protect your personal information, including by using the European Commission''s Standard Contractual Clauses for transfers of personal information between our group companies and between us and our third-party providers. These clauses require all recipients to protect all personal information that they process originating from the EEA or UK in accordance with European data protection laws and regulations. Our Standard Contractual Clauses can be provided upon request. We have implemented similar appropriate safeguards with our third-party service providers and partners and further details can be provided upon request.</p><h2><strong>10. HOW LONG DO WE KEEP YOUR INFORMATION?</strong></h2><p><em><strong>In Short:</strong> We keep your information for as long as necessary to fulfill the purposes outlined in this Privacy Policy unless otherwise required by law.</em></p><p>We will only keep your personal information for as long as it is necessary for the purposes set out in this Privacy Notice, unless a longer retention period is required or permitted by law (such as tax, accounting, or other legal requirements). No purpose in this notice will require us keeping your personal information for longer than the period of time in which users have an account with us.</p><p>When we have no ongoing legitimate business need to process your personal information, we will either delete or anonymize such information, or, if this is not possible (for example, because your personal information has been stored in backup archives), then we will securely store your personal information and isolate it from any further processing until deletion is possible.</p><h2><strong>11. HOW DO WE KEEP YOUR INFORMATION SAFE?</strong></h2><p><em><strong>In Short:</strong> We aim to protect your personal information through a system of organizational and technical security measures.</em></p><p>We have implemented appropriate and reasonable technical and organizational security measures designed to protect the security of any personal information we process. However, despite our safeguards and efforts to secure your information, no electronic transmission over the Internet or information storage technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers, cybercriminals, or other unauthorized third parties will not be able to defeat our security and improperly collect, access, steal, or modify your information. Although we will do our best to protect your personal information, transmission of personal information to and from our Services is at your own risk. You should only access the Services within a secure environment.</p><h2><strong>12. WHAT ARE YOUR PRIVACY RIGHTS?</strong></h2><p><em><strong>In Short:</strong> Depending on your state of residence in the US or in some regions, such as the European Economic Area (EEA), United Kingdom (UK), Switzerland, and Canada, you have rights that allow you greater access to and control over your personal information. You may review, change, or terminate your account at any time, depending on your country, province, or state of residence.</em></p><p>In some regions (like the EEA, UK, Switzerland, and Canada), you have certain rights under applicable data protection laws. These may include the right (i) to request access and obtain a copy of your personal information, (ii) to request rectification or erasure; (iii) to restrict the processing of your personal information; (iv) if applicable, to data portability; and (v) not to be subject to automated decision-making. In certain circumstances, you may also have the right to object to the processing of your personal information. You can make such a request by contacting us by using the contact details provided in the section "<a href="#jump-contact">HOW CAN YOU CONTACT US ABOUT THIS NOTICE?</a>" below.</p><p>We will consider and act upon any request in accordance with applicable data protection laws.</p><p>If you are located in the EEA or UK and you believe we are unlawfully processing your personal information, you also have the right to complain to your <a href="https://ec.europa.eu/justice/data-protection/bodies/authorities/index_en.htm">Member State data protection authority</a> or <a href="https://ico.org.uk/make-a-complaint/data-protection-complaints/data-protection-complaints/">UK data protection authority</a>.</p><p>If you are located in Switzerland, you may contact the <a href="https://www.edoeb.admin.ch/edoeb/en/home.html">Federal Data Protection and Information Commissioner</a>.</p><p><strong>Withdrawing your consent:</strong> If we are relying on your consent to process your personal information, which may be express and/or implied consent depending on the applicable law, you have the right to withdraw your consent at any time. You can withdraw your consent at any time by contacting us by using the contact details provided in the section "<a href="#jump-contact">HOW CAN YOU CONTACT US ABOUT THIS NOTICE?</a>" below or updating your preferences.</p><p>However, please note that this will not affect the lawfulness of the processing before its withdrawal nor, when applicable law allows, will it affect the processing of your personal information conducted in reliance on lawful processing grounds other than consent.</p><p><strong>Opting out of marketing and promotional communications:</strong> You can unsubscribe from our marketing and promotional communications at any time by clicking on the unsubscribe link in the emails that we send, or by contacting us using the details provided in the section "<a href="#jump-contact">HOW CAN YOU CONTACT US ABOUT THIS NOTICE?</a>" below. You will then be removed from the marketing lists. However, we may still communicate with you — for example, to send you service-related messages that are necessary for the administration and use of your account, to respond to service requests, or for other non-marketing purposes.</p><h3><strong>Account Information</strong></h3><p>If you would at any time like to review or change the information in your account or terminate your account, you can:</p><ul><li data-list-item-id="e5ed80f168f68efad50ebd750062ac443">Log in to your account settings and update your user account.</li></ul><p>Upon your request to terminate your account, we will deactivate or delete your account and information from our active databases. However, we may retain some information in our files to prevent fraud, troubleshoot problems, assist with any investigations, enforce our legal terms and/or comply with applicable legal requirements.</p><p><strong>Cookies and similar technologies:</strong> Most Web browsers are set to accept cookies by default. If you prefer, you can usually choose to set your browser to remove cookies and to reject cookies. If you choose to remove cookies or reject cookies, this could affect certain features or services of our Services. You may also <a href="http://www.aboutads.info/choices/">opt out of interest-based advertising by advertisers</a> on our Services.</p><p>If you have questions or comments about your privacy rights, you may email us at privacy@curtistinkers.com.</p><h2><strong>13. CONTROLS FOR DO-NOT-TRACK FEATURES</strong></h2><p>Most web browsers and some mobile operating systems and mobile applications include a Do-Not-Track ("DNT") feature or setting you can activate to signal your privacy preference not to have data about your online browsing activities monitored and collected. At this stage, no uniform technology standard for recognizing and implementing DNT signals has been finalized. As such, we do not currently respond to DNT browser signals or any other mechanism that automatically communicates your choice not to be tracked online. If a standard for online tracking is adopted that we must follow in the future, we will inform you about that practice in a revised version of this Privacy Policy.</p><p>California law requires us to let you know how we respond to web browser DNT signals. Because there currently is not an industry or legal standard for recognizing or honoring DNT signals, we do not respond to them at this time.</p><h2><strong>14. DO UNITED STATES RESIDENTS HAVE SPECIFIC PRIVACY RIGHTS?</strong></h2><p><em><strong>In Short:</strong> If you are a resident of California, Colorado, Connecticut, Delaware, Florida, Indiana, Iowa, Kentucky, Minnesota, Montana, Nebraska, New Hampshire, New Jersey, Oregon, Tennessee, Texas, Utah, or Virginia, you may have the right to request access to and receive details about the personal information we maintain about you and how we have processed it, correct inaccuracies, get a copy of, or delete your personal information. You may also have the right to withdraw your consent to our processing of your personal information. These rights may be limited in some circumstances by applicable law. More information is provided below.</em></p><h3><strong>Categories of Personal Information We Collect</strong></h3><p>We have collected the following categories of personal information in the past twelve (12) months:</p><table class="table"><tbody><tr><td><strong>Category</strong></td><td><strong>Examples</strong></td><td><strong>Collected</strong></td></tr><tr><td>A. Identifiers</td><td>Contact details, such as real name, alias, postal address, telephone or mobile contact number, unique personal identifier, online identifier, Internet Protocol address, email address, and account name</td><td>YES</td></tr><tr><td>B. Personal information as defined in the California Customer Records statute</td><td>Name, contact information, education, employment, employment history, and financial information</td><td>YES</td></tr><tr><td>C. Protected classification characteristics under state or federal law</td><td>Gender, age, date of birth, race and ethnicity, national origin, marital status, and other demographic data</td><td>YES</td></tr><tr><td>D. Commercial information</td><td>Transaction information, purchase history, financial details, and payment information</td><td>YES</td></tr><tr><td>E. Biometric information</td><td>Fingerprints and voiceprints</td><td>NO</td></tr><tr><td>F. Internet or other similar network activity</td><td>Browsing history, search history, online behavior, interest data, and interactions with our and other websites, applications, systems, and advertisements</td><td>YES</td></tr><tr><td>G. Geolocation data</td><td>Device location</td><td>YES</td></tr><tr><td>H. Audio, electronic, sensory, or similar information</td><td>Images and audio, video or call recordings created in connection with our business activities</td><td>NO</td></tr><tr><td>I. Professional or employment-related information</td><td>Business contact details in order to provide you our Services at a business level or job title, work history, and professional qualifications if you apply for a job with us</td><td>NO</td></tr><tr><td>J. Education Information</td><td>Student records and directory information</td><td>NO</td></tr><tr><td>K. Inferences drawn from collected personal information</td><td>Inferences drawn from any of the collected personal information listed above to create a profile or summary about, for example, an individual’s preferences and characteristics</td><td>NO</td></tr><tr><td>L. Sensitive personal Information</td><td>&nbsp;</td><td>NO</td></tr></tbody></table><p>We may also collect other personal information outside of these categories through instances where you interact with us in person, online, or by phone or mail in the context of:</p><ul><li data-list-item-id="e7f9ed76589d1dc31b0c70d046c8cc615">Receiving help through our customer support channels;</li><li data-list-item-id="ee01b192b67a71e3558411c3a500f42a7">Participation in customer surveys or contests; and</li><li data-list-item-id="ea0a2b7119dfa92836b8168f0bab28539">Facilitation in the delivery of our Services and to respond to your inquiries.</li></ul><p>We will use and retain the collected personal information as needed to provide the Services or for:</p><ul><li data-list-item-id="e55ab3405149edc8927b565849ab8028c">Category A - As long as the user has an account with us</li><li data-list-item-id="e7291d9f2fd8fcad2c405916c2eb222d6">Category B - As long as the user has an account with us</li><li data-list-item-id="e764c2b0159f9c5d66241ac86d18374ad">Category C - As long as the user has an account with us</li><li data-list-item-id="ecac78fe67cb12e6d6db1bf5b16d1512e">Category D - As long as the user has an account with us</li><li data-list-item-id="eb5d1a4bba67fef498e12933a64508398">Category F - As long as the user has an account with us</li><li data-list-item-id="e553956896e3285a24a19e10bbf42cc6c">Category G - As long as the user has an account with us</li></ul><h3><strong>Sources of Personal Information</strong></h3><p>Learn more about the sources of personal information we collect in "<a href="#jump-infocollect">WHAT INFORMATION DO WE COLLECT?</a>"</p><h3><strong>How We Use and Share Personal Information</strong></h3><p>Learn more about how we use your personal information in the section, "<a href="#jump-infouse">HOW DO WE PROCESS YOUR INFORMATION?</a>"</p><p>We collect and share your personal information through:</p><ul><li data-list-item-id="e08b68e96236fbc59383c5667a90cf966">Social media cookies</li><li data-list-item-id="e52fd7ba5b607f45d4526aebc3b201bcf">Beacons/Pixels/Tags</li></ul><p><strong>Will your information be shared with anyone else?</strong></p><p>We may disclose your personal information with our service providers pursuant to a written contract between us and each service provider. Learn more about how we disclose personal information to in the section, "<a href="#jump-whoshare">WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?</a>"</p><p>We may use your personal information for our own business purposes, such as for undertaking internal research for technological development and demonstration. This is not considered to be "selling" of your personal information.</p><p>We have not sold or shared any personal information to third parties for a business or commercial purpose in the preceding twelve (12) months. We have disclosed the following categories of personal information to third parties for a business or commercial purpose in the preceding twelve (12) months:</p><p>The categories of third parties to whom we disclosed personal information for a business or commercial purpose can be found under "<a href="#jump-whoshare">WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?</a>"</p><h3><strong>Your Rights</strong></h3><p>You have rights under certain US state data protection laws. However, these rights are not absolute, and in certain cases, we may decline your request as permitted by law. These rights include:</p><ul><li data-list-item-id="e95ce6cf5f72a98c6e1937ff28b42e77d"><strong>Right to know</strong> whether or not we are processing your personal data</li><li data-list-item-id="e3b5240ed9e905df06c8e3bd9a3b464d7"><strong>Right to access</strong> your personal data</li><li data-list-item-id="eba00dec1ffc01a4de11f70f1ffd36df6"><strong>Right to correct</strong> inaccuracies in your personal data</li><li data-list-item-id="ecbe75096212798be377aba725d4c0c4e"><strong>Right to request</strong> the deletion of your personal data</li><li data-list-item-id="e1c721425558051c3811d33baba4af08d"><strong>Right to obtain a copy</strong> of the personal data you previously shared with us</li><li data-list-item-id="ef7aaea85ad4867ad7e650f3d31fbfed1"><strong>Right to non-discrimination</strong> for exercising your rights</li><li data-list-item-id="edf87a4dfcc637b176cec3da151087d1d"><strong>Right to opt out</strong> of the processing of your personal data if it is used for targeted advertising (or sharing as defined under California’s privacy law), the sale of personal data, or profiling in furtherance of decisions that produce legal or similarly significant effects ("profiling")</li></ul><p>Depending upon the state where you live, you may also have the following rights:</p><ul><li data-list-item-id="e056b74fa9742cfb9926ac24fd65990a8">Right to access the categories of personal data being processed (as permitted by applicable law, including Minnesota’s privacy law)</li><li data-list-item-id="ebc15d6b6b65758c245a65fb7f0f8bd43">Right to obtain a list of the categories of third parties to which we have disclosed personal data (as permitted by applicable law, including California''s and Delaware''s privacy law)</li><li data-list-item-id="e1d35ba3b13adf417391cca6e36074041">Right to obtain a list of specific third parties to which we have disclosed personal data (as permitted by applicable law, including Minnesota''s and Oregon''s privacy law)</li><li data-list-item-id="e4798e7e11e4614f183789e4569657f14">Right to review, understand, question, and correct how personal data has been profiled (as permitted by applicable law, including Minnesota’s privacy law)</li><li data-list-item-id="eb09ceb26e554dce9841dd4b03dcebd24">Right to limit use and disclosure of sensitive personal data (as permitted by applicable law, including California’s privacy law)</li><li data-list-item-id="e3dc33a49ee4e848bd5689bdef6bf75ff">Right to opt out of the collection of sensitive data and personal data collected through the operation of a voice or facial recognition feature (as permitted by applicable law, including Florida’s privacy law)</li></ul><h3><strong>How to Exercise Your Rights</strong></h3><p>To exercise these rights, you can contact us by visiting curtistinkers.com/contact, by visiting curtistinkers.com/contact, or by referring to the contact details at the bottom of this document.</p><p>We will honor your opt-out preferences if you enact the <a href="https://globalprivacycontrol.org/">Global Privacy Control</a> (GPC) opt-out signal on your browser.</p><p>Under certain US state data protection laws, you can designate an authorized agent to make a request on your behalf. We may deny a request from an authorized agent that does not submit proof that they have been validly authorized to act on your behalf in accordance with applicable laws.</p><h3><strong>Request Verification</strong></h3><p>Upon receiving your request, we will need to verify your identity to determine you are the same person about whom we have the information in our system. We will only use personal information provided in your request to verify your identity or authority to make the request. However, if we cannot verify your identity from the information already maintained by us, we may request that you provide additional information for the purposes of verifying your identity and for security or fraud-prevention purposes.</p><p>If you submit the request through an authorized agent, we may need to collect additional information to verify your identity before processing your request and the agent will need to provide a written and signed permission from you to submit such request on your behalf.</p><h3><strong>Appeals</strong></h3><p>Under certain US state data protection laws, if we decline to take action regarding your request, you may appeal our decision by emailing us at privacy@curtistinkers.com. We will inform you in writing of any action taken or not taken in response to the appeal, including a written explanation of the reasons for the decisions. If your appeal is denied, you may submit a complaint to your state attorney general.</p><h3><strong>California "Shine The Light" Law</strong></h3><p>California Civil Code Section 1798.83, also known as the "Shine The Light" law, permits our users who are California residents to request and obtain from us, once a year and free of charge, information about categories of personal information (if any) we disclosed to third parties for direct marketing purposes and the names and addresses of all third parties with which we shared personal information in the immediately preceding calendar year. If you are a California resident and would like to make such a request, please submit your request in writing to us by using the contact details provided in the section "<a href="#jump-contact">HOW CAN YOU CONTACT US ABOUT THIS NOTICE?</a>"</p><h2><strong>15. DO OTHER REGIONS HAVE SPECIFIC PRIVACY RIGHTS?</strong></h2><p><em><strong>In Short:</strong> You may have additional rights based on the country you reside in.</em></p><p><strong>New Zealand</strong></p><p>We collect and process your personal information under the obligations and conditions set by New Zealand''s Privacy Act 2020 (Privacy Act).</p><p>This Privacy Policy satisfies the notice requirements defined in the Privacy Act, in particular: what personal information we collect from you, from which sources, for which purposes, and other recipients of your personal information.</p><p>If you do not wish to provide the personal information necessary to fulfill their applicable purpose, it may affect our ability to provide our services, in particular:</p><ul><li data-list-item-id="e0c9eac115e6c2f7966afeae311805c33">offer you the products or services that you want</li><li data-list-item-id="ed812934f1a40ba71b5af5633ae51721b">respond to or help with your requests</li><li data-list-item-id="ea328f3afec271f2ec3d82ac9322eb354">manage your account with us</li><li data-list-item-id="e921a0c5afa4cf978f00be33255133cf6">confirm your identity and protect your account</li></ul><p>At any time, you have the right to request access to or correction of your personal information. You can make such a request by contacting us by using the contact details provided in the section "<a href="#jump-request">HOW CAN YOU REVIEW, UPDATE, OR DELETE THE DATA WE COLLECT FROM YOU?</a>"</p><p>If you believe we are unlawfully processing your personal information, you have the right to submit a complaint about a breach of New Zealand''s Privacy Principles to the <a href="https://www.privacy.org.nz/your-rights/making-a-complaint/">Office of New Zealand Privacy Commissioner</a>.</p><h2><strong>16. DO WE MAKE UPDATES TO THIS NOTICE?</strong></h2><p><em><strong>In Short:</strong> Yes, we will update this notice as necessary to stay compliant with relevant laws.</em></p><p>We may update this Privacy Policy from time to time. The updated version will be indicated by an updated "Revised" date at the top of this Privacy Policy. If we make material changes to this Privacy Policy, we may notify you either by prominently posting a notice of such changes or by directly sending you a notification. We encourage you to review this Privacy Policy frequently to be informed of how we are protecting your information.</p><h2><strong>17. HOW CAN YOU CONTACT US ABOUT THIS NOTICE?</strong></h2><p>If you have questions or comments about this notice, you may email us at privacy@curtistinkers.com.</p><h2><strong>18. HOW CAN YOU REVIEW, UPDATE, OR DELETE THE DATA WE COLLECT FROM YOU?</strong></h2><p>You have the right to request access to the personal information we collect from you, details about how we have processed it, correct inaccuracies, or delete your personal information. You may also have the right to withdraw your consent to our processing of your personal information. These rights may be limited in some circumstances by applicable law. To request to review, update, or delete your personal information, please visit: curtistinkers.com/contact.</p>'
