name: Basic Privacy
description: Sets up a site with basic privacy features like consent management and remote content blocking.
type: Drupal CMS
recipes:
  - core/recipes/basic_html_format_editor
  - core/recipes/page_content_type
install:
  - klaro
  - menu_link_content
config:
  strict: false
  import:
    klaro: '*'
    system:
      - system.menu.footer
  actions:
    klaro.settings:
      simpleConfigUpdate:
        auto_decorate_final_html: true
    klaro.texts:
      simpleConfigUpdate:
        consentModal.privacyPolicy.url: 'internal:/privacy-policy'
    klaro.klaro_app.cms:
      simpleConfigUpdate:
        label: 'Drupal CMS'
    user.role.anonymous:
      grantPermission: 'use klaro'
    user.role.authenticated:
      grantPermission: 'use klaro'
