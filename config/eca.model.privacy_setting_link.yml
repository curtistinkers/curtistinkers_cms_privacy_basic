modeldata: |
  <?xml version="1.0" encoding="UTF-8"?>
  <bpmn2:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:camunda="http://camunda.org/schema/1.0/bpmn" xmlns:qa="http://some-company/schema/bpmn/qa" id="sample-diagram" targetNamespace="http://bpmn.io/schema/bpmn" xsi:schemaLocation="http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd">
    <bpmn2:process id="privacy_setting_link" name="Show link to privacy settings" isExecutable="true" camunda:versionTag="0.0.0">
      <bpmn2:startEvent id="Event_save_config" name="Save config" camunda:modelerTemplate="org.drupal.event.config:save">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="config:save" />
          </camunda:properties>
        </bpmn2:extensionElements>
        <bpmn2:outgoing>Flow_klaro_app</bpmn2:outgoing>
      </bpmn2:startEvent>
      <bpmn2:task id="Activity_and_1" name="AND" camunda:modelerTemplate="org.drupal.action.eca_void_and_condition">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_void_and_condition" />
          </camunda:properties>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_klaro_app</bpmn2:incoming>
        <bpmn2:outgoing>Flow_enabled</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:sequenceFlow id="Flow_klaro_app" name="Klaro app?" camunda:modelerTemplate="org.drupal.condition.eca_scalar" sourceRef="Event_save_config" targetRef="Activity_and_1">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_scalar" />
          </camunda:properties>
          <camunda:field name="left">
            <camunda:string>[config_name]</camunda:string>
          </camunda:field>
          <camunda:field name="operator">
            <camunda:string>beginswith</camunda:string>
          </camunda:field>
          <camunda:field name="right">
            <camunda:string>klaro.klaro_app.</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>value</camunda:string>
          </camunda:field>
          <camunda:field name="case">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="negate">
            <camunda:string>no</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:task id="Activity_and_2" name="AND" camunda:modelerTemplate="org.drupal.action.eca_void_and_condition">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_void_and_condition" />
          </camunda:properties>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_enabled</bpmn2:incoming>
        <bpmn2:outgoing>Flow_was_disabled</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:sequenceFlow id="Flow_enabled" name="enabled?" camunda:modelerTemplate="org.drupal.condition.eca_scalar" sourceRef="Activity_and_1" targetRef="Activity_and_2">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_scalar" />
          </camunda:properties>
          <camunda:field name="left">
            <camunda:string>[config:status]</camunda:string>
          </camunda:field>
          <camunda:field name="operator">
            <camunda:string>equal</camunda:string>
          </camunda:field>
          <camunda:field name="right">
            <camunda:string>1</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>value</camunda:string>
          </camunda:field>
          <camunda:field name="case">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="negate">
            <camunda:string>no</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:task id="Activity_and_3" name="Switch to user 1" camunda:modelerTemplate="org.drupal.action.eca_switch_account">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_switch_account" />
          </camunda:properties>
          <camunda:field name="user_id">
            <camunda:string>1</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_was_disabled</bpmn2:incoming>
        <bpmn2:outgoing>Flow_not_required</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:sequenceFlow id="Flow_was_disabled" name="was&#10;disabled?" camunda:modelerTemplate="org.drupal.condition.eca_scalar" sourceRef="Activity_and_2" targetRef="Activity_and_3">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_scalar" />
          </camunda:properties>
          <camunda:field name="left">
            <camunda:string>[config_original:status]</camunda:string>
          </camunda:field>
          <camunda:field name="operator">
            <camunda:string>equal</camunda:string>
          </camunda:field>
          <camunda:field name="right">
            <camunda:string>1</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>value</camunda:string>
          </camunda:field>
          <camunda:field name="case">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="negate">
            <camunda:string>yes</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:task id="Activity_load_menu_link" name="Load menu link" camunda:modelerTemplate="org.drupal.action.eca_token_load_entity">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_token_load_entity" />
          </camunda:properties>
          <camunda:field name="token_name">
            <camunda:string>menulink</camunda:string>
          </camunda:field>
          <camunda:field name="from">
            <camunda:string>properties</camunda:string>
          </camunda:field>
          <camunda:field name="entity_type">
            <camunda:string>menu_link_content</camunda:string>
          </camunda:field>
          <camunda:field name="entity_id">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="revision_id">
            <camunda:string></camunda:string>
          </camunda:field>
          <camunda:field name="langcode">
            <camunda:string>_interface</camunda:string>
          </camunda:field>
          <camunda:field name="latest_revision">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="unchanged">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="properties">
            <camunda:string>uuid: d7f4f1b2-af94-46b8-ac63-a8a5b14fb0f5</camunda:string>
          </camunda:field>
          <camunda:field name="object">
            <camunda:string></camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_not_required</bpmn2:incoming>
        <bpmn2:outgoing>Flow_disabled</bpmn2:outgoing>
      </bpmn2:task>
      <bpmn2:task id="Activity_enable_menu_link" name="Enable menu link" camunda:modelerTemplate="org.drupal.action.eca_set_field_value">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_set_field_value" />
          </camunda:properties>
          <camunda:field name="method">
            <camunda:string>set:clear</camunda:string>
          </camunda:field>
          <camunda:field name="strip_tags">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="field_name">
            <camunda:string>enabled</camunda:string>
          </camunda:field>
          <camunda:field name="trim">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="field_value">
            <camunda:string>1</camunda:string>
          </camunda:field>
          <camunda:field name="save_entity">
            <camunda:string>yes</camunda:string>
          </camunda:field>
          <camunda:field name="object">
            <camunda:string>menulink</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:incoming>Flow_disabled</bpmn2:incoming>
      </bpmn2:task>
      <bpmn2:sequenceFlow id="Flow_disabled" name="disabled?" camunda:modelerTemplate="org.drupal.condition.eca_entity_field_value" sourceRef="Activity_load_menu_link" targetRef="Activity_enable_menu_link">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_entity_field_value" />
          </camunda:properties>
          <camunda:field name="field_name">
            <camunda:string>enabled</camunda:string>
          </camunda:field>
          <camunda:field name="operator">
            <camunda:string>equal</camunda:string>
          </camunda:field>
          <camunda:field name="expected_value">
            <camunda:string>1</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>value</camunda:string>
          </camunda:field>
          <camunda:field name="case">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="negate">
            <camunda:string>yes</camunda:string>
          </camunda:field>
          <camunda:field name="entity">
            <camunda:string>menulink</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
      <bpmn2:sequenceFlow id="Flow_not_required" name="not&#10;required?" camunda:modelerTemplate="org.drupal.condition.eca_scalar" sourceRef="Activity_and_3" targetRef="Activity_load_menu_link">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_scalar" />
          </camunda:properties>
          <camunda:field name="left">
            <camunda:string>[config:required]</camunda:string>
          </camunda:field>
          <camunda:field name="operator">
            <camunda:string>equal</camunda:string>
          </camunda:field>
          <camunda:field name="right">
            <camunda:string>1</camunda:string>
          </camunda:field>
          <camunda:field name="type">
            <camunda:string>value</camunda:string>
          </camunda:field>
          <camunda:field name="case">
            <camunda:string>no</camunda:string>
          </camunda:field>
          <camunda:field name="negate">
            <camunda:string>yes</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
      </bpmn2:sequenceFlow>
    </bpmn2:process>
